<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Právo SR – Presmerovanie...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment.
      var pathSegmentsToKeep = 1; // 1 for project pages (e.g. username.github.io/repo-name/)

      var l = window.location;
      // If hosted on custom domain (not github.io), pathSegmentsToKeep is 0
      if (!l.hostname.endsWith('github.io')) {
        pathSegmentsToKeep = 0;
      }

      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;

      l.replace(redirectUrl);
    </script>
  </head>
  <body style="background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Načítavam stránku...</p>
  </body>
</html>
